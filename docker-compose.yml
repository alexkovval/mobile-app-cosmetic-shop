services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmetics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmetics
      POSTGRES_PASSWORD: cosmetics
      POSTGRES_DB: cosmetics
    ports:
      - "5432:5432"
    volumes:
      - cosmetics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmetics -d cosmetics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cosmetics_postgres_data:
